    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                900: '#0c4a6e',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Universally ensure light backgrounds and high-contrast dark text for all inputs, selects, and textareas */
      input:not([type="file"]):not([type="checkbox"]):not([type="radio"]), 
      select, 
      textarea {
          background-color: #ffffff !important;
          color: #0f172a !important; /* high-contrast dark slate text */
          border-color: #cbd5e1 !important; /* crisp slate-300 border */
      }
      
      /* Ensure placeholder text is highly readable but distinctive */
      input::placeholder, 
      textarea::placeholder {
          color: #64748b !important; /* slate-500 placeholder */
      }

      /* Style for inputs when selected or focused */
      input:not([type="file"]):not([type="checkbox"]):not([type="radio"]):focus, 
      select:focus, 
      textarea:focus {
          border-color: #0284c7 !important; /* brand-600 focus ring color */
          box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15) !important;
      }
    </style>
